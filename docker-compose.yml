# Local development dependencies only. Application processes run through npm.
name: amani-ia

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    # Explicit manual restart: a failed first initialization must stay visible.
    restart: "no"
    networks: [dependencies]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amani}
      POSTGRES_USER: ${POSTGRES_USER:-amani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Authenticate TCP connections, including loopback; socket bootstrap stays local.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CORE_PLATFORM_DB_PASSWORD: ${CORE_PLATFORM_DB_PASSWORD:?Set CORE_PLATFORM_DB_PASSWORD in the root .env}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in the root .env}
      DATA_ANALYTICS_DB_PASSWORD: ${DATA_ANALYTICS_DB_PASSWORD:?Set DATA_ANALYTICS_DB_PASSWORD in the root .env}
      CONVERSATIONS_DB_PASSWORD: ${CONVERSATIONS_DB_PASSWORD:?Set CONVERSATIONS_DB_PASSWORD in the root .env}
      CONNECTORS_DB_PASSWORD: ${CONNECTORS_DB_PASSWORD:?Set CONNECTORS_DB_PASSWORD in the root .env}
      EVALUATION_DB_PASSWORD: ${EVALUATION_DB_PASSWORD:?Set EVALUATION_DB_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: "no"
    networks: [dependencies]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # AOF is the sole persistence mechanism; future job keys must not be evicted.
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # The upstream prebuilt image is unavailable; build official pinned sources.
    image: amani-ia/minio:RELEASE.2025-10-15T17-29-55Z-local
    build:
      context: ./infrastructure/storage/minio
    pull_policy: build
    restart: "no"
    networks: [dependencies]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  dependencies:
    driver: bridge
    internal: true
